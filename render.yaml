databases:
  - name: cara-db
    plan: free
    databaseName: cara
    user: cara

services:
  - type: web
    name: cara
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cara-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_ALLOWED_HOSTS
        value: fcoclimatizacion.cl,www.fcoclimatizacion.cl
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://fcoclimatizacion.cl,https://www.fcoclimatizacion.cl
      - key: WHATSAPP_PHONE
        value: +56956393341
